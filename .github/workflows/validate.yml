name: validate

# Validates every package with the vam CLI at a pinned commit, checks each listing's release tag,
# and runs the skills' Bun tests. See README.md ("CI").

on:
  pull_request:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
  # release.yml calls this on the exact commit it is about to tag, because a tag created with the
  # workflow token does not trigger the tag-push run above.
  workflow_call:
    inputs:
      ref:
        description: "Commit to validate (full SHA)."
        required: true
        type: string

permissions:
  contents: read

env:
  # The vam ref (commit, tag or branch) whose `vam catalog validate` is the reference check.
  # Pin it to a release commit or tag in a pull request.
  VAM_REPO: squrell-inc/VAM
  VAM_COMMIT: 5f1de314bcf20c6f32f6acead62bd2df828792b0  # VAM connectors Phase 7 release (#139)
  BUN_VERSION: "1.4.4"
  # The one finding the Microsoft 365 listing is allowed to have: Graph's findMeetingTimes is a POST
  # that only computes suggestions, so the tool is READ_ONLY and declares a POST.
  ACCEPTED_FINDING: "tool 'calendar_find_slots': a READ_ONLY tool declares an egress method other than GET or HEAD"
  # Listings left out of the gate (space-separated ids). Each run prints them.
  # cornerstone: under the Phase 7 node its skills' egress names the binding `csod`, which its
  # MCP discover connector does not provide (VAM CN-7.3, "a tool's egress must name a binding of
  # its connector"), so the node refuses to import it. Excluded until its listing is fixed; this
  # applies to cornerstone only, and the entry is removed as soon as cornerstone passes.
  EXCLUDED_LISTINGS: "cornerstone"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Empty (the event's own commit) except when release.yml calls this workflow.
          ref: ${{ inputs.ref || '' }}

      - name: Restore the vam CLI
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/vam-cli
          key: vam-cli-${{ env.VAM_COMMIT }}

      - name: Build the vam CLI at the pinned commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/vam"
          git init -q "$src"
          git -C "$src" remote add origin "https://github.com/${VAM_REPO}.git"
          if ! git -C "$src" fetch -q --depth 1 origin "$VAM_COMMIT"; then
            echo "::error title=Cannot fetch vam::Could not fetch $VAM_COMMIT from $VAM_REPO. Check that the ref exists."
            exit 1
          fi
          git -C "$src" checkout -q --detach FETCH_HEAD
          (cd "$src" && cargo build --release -p vam-cli)
          mkdir -p ~/vam-cli
          cp "$src/target/release/vam" ~/vam-cli/vam

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate the repository (strict, one accepted finding)
        run: |
          set -euo pipefail
          export PATH="$HOME/vam-cli:$PATH"
          "$HOME/vam-cli/vam" --version || true
          .github/scripts/gated-root.sh . "$RUNNER_TEMP/gated"
          gate() {
            # $1: label, then the command. Fails on an error or on any finding except the accepted one.
            local label="$1"; shift
            local out
            out="$("$@" || true)"
            if ! echo "$out" | jq -e --arg ok "$ACCEPTED_FINDING" '.ok == true and ([.findings[] | select(.message != $ok)] | length) == 0' >/dev/null; then
              echo "::error::$label failed"; echo "$out" | jq -r '.findings[]? | "\(.level) \(.listing) \(.path): \(.message)"' 2>/dev/null || echo "$out"
              return 1
            fi
            echo "$out" | jq -r '.findings[] | "\(.level) \(.listing) \(.path): \(.message)"'
            echo "$label: ok"
          }
          gate "vam catalog validate" "$HOME/vam-cli/vam" catalog validate "$RUNNER_TEMP/gated" --json
          # The listing rules the node applies at install (bindings, hosts, the connector file).
          gate "vam connector validate" "$HOME/vam-cli/vam" --json connector validate "$RUNNER_TEMP/gated"

      - name: Connector tests (offline, behind the egress gate's own screen)
        run: |
          set -euo pipefail
          .github/scripts/gated-root.sh . "$RUNNER_TEMP/gated"
          # Runs each listing's tests/connector-test.json. A remote MCP listing is checked and
          # skipped (the node is its client). Exits 6 if no case ran or the key reached a tool.
          "$HOME/vam-cli/vam" connector test "$RUNNER_TEMP/gated"

      - name: Check each listing's release tag
        run: |
          set -euo pipefail
          export PATH="$HOME/vam-cli:$PATH"
          fail=0
          for row in $(jq -r '.listings[] | "\(.id)=\(.ref)"' marketplace.json); do
            id="${row%%=*}"; ref="${row#*=}"
            if [[ " $EXCLUDED_LISTINGS " == *" $id "* ]]; then
              echo "::warning::listing $id ($ref) is excluded from the gate (see EXCLUDED_LISTINGS)"; continue
            fi
            if ! git rev-parse -q --verify "refs/tags/$ref^{commit}" >/dev/null; then
              if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
                echo "::error::listing $id names tag $ref, which does not exist"; fail=1
              else
                echo "::notice::listing $id names $ref, which is not tagged yet (tag the merge commit to release it)"
              fi
              continue
            fi
            dir="$RUNNER_TEMP/at-$ref"
            git worktree add -q --detach "$dir" "refs/tags/$ref"
            named="$(jq -r --arg id "$id" '.listings[] | select(.id == $id) | .ref' "$dir/marketplace.json")"
            if [ "$named" != "$ref" ]; then
              echo "::error::at tag $ref the index names $named for $id; the tag must hold an index that names itself"; fail=1
            fi
            .github/scripts/gated-root.sh "$dir" "$dir-gated"
            out="$("$HOME/vam-cli/vam" catalog validate "$dir-gated" --json || true)"
            if ! echo "$out" | jq -e --arg ok "$ACCEPTED_FINDING" '.ok == true and ([.findings[] | select(.message != $ok)] | length) == 0' >/dev/null; then
              echo "::error::$ref does not validate"; echo "$out" | jq -r '.findings[] | "\(.level) \(.path): \(.message)"'; fail=1
            else
              echo "$ref validates"
            fi
          done
          exit $fail

      - name: Bun tests
        run: bun test tests
